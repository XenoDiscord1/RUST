name: C++ Windows Build with ImGui

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download ImGui Headers
      run: |
        curl -L -o imgui.h https://githubusercontent.com
        curl -L -o imgui_internal.h https://githubusercontent.com
        curl -L -o imstb_rectpack.h https://githubusercontent.com
        curl -L -o imstb_textedit.h https://githubusercontent.com
        curl -L -o imstb_truetype.h https://githubusercontent.com
      shell: bash

    - name: Compile Code
      run: cl.exe /O2 /EHsc *.cpp /Fe:program.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: program.exe
